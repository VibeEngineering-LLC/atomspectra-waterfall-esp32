name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'firmware-v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: '.'
      - name: SHA256 firmware bin
        run: |
          BIN=build/atomspectra_gw.bin
          test -f "$BIN"
          sha256sum "$BIN" | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atomspectra_gw
          path: |
            build/atomspectra_gw.bin
            SHA256.txt
